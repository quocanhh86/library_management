  <text x="65" y="205" font-family="Georgia, serif" font-size="15.5" fill="#1E293B">1.1. Đặt vấn đề v&#224; bối cảnh nghi&#234;n cứu (NXB Th&#244;ng Tin &amp;</text>
<text x="65" y="231" font-family="Georgia, serif" font-size="15.5" fill="#1E293B">Truyền Th&#244;ng, 2025):</text>
