<text x="65" y="403" font-family="Georgia, serif" font-size="15.5" fill="#1E293B">1.3. C&#225;c nguy&#234;n l&#253; v&#224; ti&#234;u chuẩn kỹ thuật bắt buộc tu&#226;n</text>
