      <text x="64" y="182" font-family="'Segoe UI', Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0F172A">2.1. Sơ đồ quy trình phân tích, thiết kế và kiểm định 4</text>
      <text x="64" y="205" font-family="'Segoe UI', Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0F172A">giai đoạn:</text>
      <text x="64" y="238" font-family="'Segoe UI', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1E293B">Quy trình chuẩn áp dụng cho sinh viên, kỹ sư và học viên</text>
