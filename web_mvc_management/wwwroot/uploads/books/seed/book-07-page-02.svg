      <text x="64" y="294" font-family="'Segoe UI', Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0F172A">2.2. Câu hỏi ôn tập và Bài tập thảo luận cuối chương:</text>
      <text x="64" y="327" font-family="'Segoe UI', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1E293B">• Câu 1: Phân tích các yếu tố ảnh hưởng trực tiếp đến</text>
      <text x="64" y="350" font-family="'Segoe UI', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1E293B">hiệu năng mô hình trong Văn học &amp; Kỹ năng mềm.</text>
      <text x="64" y="383" font-family="'Segoe UI', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1E293B">• Câu 2: Thực hành bài toán mẫu (Mã ISBN:</text>
      <text x="64" y="406" font-family="'Segoe UI', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1E293B">978-6042081234) và đối chiếu kết quả tại phòng đọc UTC.</text>
