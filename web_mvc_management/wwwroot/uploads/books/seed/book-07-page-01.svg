  <text x="80" y="142" font-family="Segoe UI, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#064E3B">CHƯƠNG 1: TỔNG QUAN &amp; CƠ SỞ L&#221; THUYẾT CỐT L&#213;I</text>
  <text x="65" y="205" font-family="Georgia, serif" font-size="15.5" fill="#1E293B">1.1. Đặt vấn đề v&#224; bối cảnh nghi&#234;n cứu (NXB Trẻ, 2022):</text>
<text x="65" y="245" font-family="Georgia, serif" font-size="15.5" fill="#1E293B">T&#225;c phẩm văn học Việt Nam đương đại gi&#224;u cảm x&#250;c, bồi</text>
<text x="65" y="271" font-family="Georgia, serif" font-size="15.5" fill="#1E293B">dưỡng t&#226;m hồn v&#224; g&#243;c nh&#236;n nh&#226;n văn cho sinh vi&#234;n sau những</text>
<text x="65" y="311" font-family="Georgia, serif" font-size="15.5" fill="#1E293B">1.2. T&#225;c giả bi&#234;n soạn: Nguyễn Nhật &#193;nh.</text>
<text x="65" y="351" font-family="Georgia, serif" font-size="15.5" fill="#1E293B">1.3. C&#225;c nguy&#234;n l&#253; v&#224; ti&#234;u chuẩn kỹ thuật bắt buộc tu&#226;n</text>
<text x="65" y="377" font-family="Georgia, serif" font-size="15.5" fill="#1E293B">thủ:</text>
<text x="65" y="417" font-family="Georgia, serif" font-size="15.5" fill="#1E293B">• Đảm bảo t&#237;nh ch&#237;nh x&#225;c to&#225;n học, to&#224;n vẹn dữ liệu v&#224; khả</text>
<text x="65" y="443" font-family="Georgia, serif" font-size="15.5" fill="#1E293B">năng mở rộng hệ thống.</text>
<text x="65" y="483" font-family="Georgia, serif" font-size="15.5" fill="#1E293B">• Kết hợp chặt chẽ giữa m&#244; h&#236;nh l&#253; thuyết với quy chuẩn kỹ</text>
<text x="65" y="509" font-family="Georgia, serif" font-size="15.5" fill="#1E293B">thuật quốc gia (TCVN / Quốc tế).</text>

