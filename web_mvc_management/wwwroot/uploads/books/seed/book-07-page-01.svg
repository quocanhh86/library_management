  </defs>
  <rect width="600" height="830" fill="#FCFBF7" stroke="#CBD5E1" stroke-width="3"/>
  <rect x="36" y="32" width="528" height="766" fill="none" stroke="#E2E8F0" stroke-width="1.5"/>
  <g clip-path="url(#pageClip)">
    <text x="64" y="68" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="700" fill="#64748B">Tôi Thấy Hoa Vàng Trên Cỏ Xanh</text>
    <line x1="64" y1="82" x2="536" y2="82" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="64" y="102" width="472" height="44" rx="6" fill="#064E3B" fill-opacity="0.09" stroke="#064E3B" stroke-opacity="0.25"/>
    <text x="80" y="129" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#064E3B">CHƯƠNG 1: TỔNG QUAN &amp; CƠ SỞ LÝ THUYẾT CỐT LÕI</text>
      <text x="64" y="182" font-family="'Segoe UI', Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0F172A">1.1. Đặt vấn đề và bối cảnh nghiên cứu (NXB Trẻ, 2022):</text>
      <text x="64" y="215" font-family="'Segoe UI', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1E293B">Tác phẩm văn học Việt Nam đương đại giàu cảm xúc, bồi</text>
      <text x="64" y="238" font-family="'Segoe UI', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1E293B">dưỡng tâm hồn và góc nhìn nhân văn cho sinh viên sau</text>
      <text x="64" y="261" font-family="'Segoe UI', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1E293B">những giờ học kỹ thuật căng thẳng.</text>
      <text x="64" y="294" font-family="'Segoe UI', Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0F172A">1.2. Tác giả biên soạn: Nguyễn Nhật Ánh.</text>
      <text x="64" y="327" font-family="'Segoe UI', Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0F172A">1.3. Các nguyên lý và tiêu chuẩn kỹ thuật bắt buộc tuân</text>
      <text x="64" y="350" font-family="'Segoe UI', Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0F172A">thủ:</text>
      <text x="64" y="383" font-family="'Segoe UI', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1E293B">• Đảm bảo tính chính xác toán học, toàn vẹn dữ liệu và</text>
      <text x="64" y="406" font-family="'Segoe UI', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1E293B">khả năng mở rộng hệ thống.</text>
      <text x="64" y="439" font-family="'Segoe UI', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1E293B">• Kết hợp chặt chẽ giữa mô hình lý thuyết với quy chuẩn</text>
      <text x="64" y="462" font-family="'Segoe UI', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1E293B">kỹ thuật quốc gia (TCVN / Quốc tế).</text>

    <line x1="64" y1="736" x2="536" y2="736" stroke="#CBD5E1" stroke-width="1"/>
    <text x="64" y="764" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="600" fill="#94A3B8">THƯ VIỆN ĐẠI HỌC GIAO THÔNG VẬN TẢI — BẢN ĐỌC THỬ</text>
    <text x="536" y="764" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="700" fill="#475569" text-anchor="end">Trang 12 — Đọc thử Chương 1</text>
  </g>
