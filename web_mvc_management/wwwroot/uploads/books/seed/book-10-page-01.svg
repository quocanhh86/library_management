  <rect x="36" y="32" width="528" height="766" fill="none" stroke="#E2E8F0" stroke-width="1.5"/>
  <g clip-path="url(#pageClip)">
    <text x="64" y="68" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="700" fill="#64748B">Giáo trình Kết cấu Bê tông cốt thép và Thiết kế Cầu...</text>
    <line x1="64" y1="82" x2="536" y2="82" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="64" y="102" width="472" height="44" rx="6" fill="#133A32" fill-opacity="0.09" stroke="#133A32" stroke-opacity="0.25"/>
    <text x="80" y="129" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#133A32">CHƯƠNG 1: TỔNG QUAN &amp; CƠ SỞ LÝ THUYẾT CỐT LÕI</text>
      <text x="64" y="182" font-family="'Segoe UI', Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0F172A">1.1. Đặt vấn đề và bối cảnh nghiên cứu (NXB Xây Dựng,</text>
      <text x="64" y="205" font-family="'Segoe UI', Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0F172A">2024):</text>
      <text x="64" y="238" font-family="'Segoe UI', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1E293B">Nguyên lý tính toán cấu kiện chịu uốn, chịu nén lệch</text>
      <text x="64" y="261" font-family="'Segoe UI', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1E293B">tâm, kiểm toán trạng thái giới hạn cường độ và sử dụng</text>
      <text x="64" y="284" font-family="'Segoe UI', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1E293B">cho kết cấu nhịp cầu bê tông cốt thép dự ứng lực.</text>
      <text x="64" y="317" font-family="'Segoe UI', Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0F172A">1.2. Tác giả biên soạn: PGS.TS. Nguyễn Văn Hùng.</text>
      <text x="64" y="350" font-family="'Segoe UI', Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0F172A">1.3. Các nguyên lý và tiêu chuẩn kỹ thuật bắt buộc tuân</text>
      <text x="64" y="373" font-family="'Segoe UI', Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0F172A">thủ:</text>
      <text x="64" y="406" font-family="'Segoe UI', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1E293B">• Đảm bảo tính chính xác toán học, toàn vẹn dữ liệu và</text>
      <text x="64" y="429" font-family="'Segoe UI', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1E293B">khả năng mở rộng hệ thống.</text>
      <text x="64" y="462" font-family="'Segoe UI', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1E293B">• Kết hợp chặt chẽ giữa mô hình lý thuyết với quy chuẩn</text>
      <text x="64" y="485" font-family="'Segoe UI', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1E293B">kỹ thuật quốc gia (TCVN / Quốc tế).</text>

    <line x1="64" y1="736" x2="536" y2="736" stroke="#CBD5E1" stroke-width="1"/>
