  <text x="65" y="76" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#64748B">Gi&#225;o tr&#236;nh Quản trị Logistics v&#224; Vận tải Đa phươn...</text>
  <line x1="65" y1="90" x2="535" y2="90" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="65" y="114" width="470" height="44" rx="6" fill="#2E1A47" fill-opacity="0.09" stroke="#2E1A47" stroke-opacity="0.25"/>
  <text x="80" y="142" font-family="Segoe UI, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#2E1A47">CHƯƠNG 1: TỔNG QUAN &amp; CƠ SỞ L&#221; THUYẾT CỐT L&#213;I</text>
  <text x="65" y="205" font-family="Georgia, serif" font-size="15.5" fill="#1E293B">1.1. Đặt vấn đề v&#224; bối cảnh nghi&#234;n cứu (NXB Giao Th&#244;ng Vận</text>
<text x="65" y="231" font-family="Georgia, serif" font-size="15.5" fill="#1E293B">Tải, 2024):</text>
<text x="65" y="271" font-family="Georgia, serif" font-size="15.5" fill="#1E293B">Tổ chức vận tải kết hợp đường biển - đường sắt - đường bộ,</text>
<text x="65" y="297" font-family="Georgia, serif" font-size="15.5" fill="#1E293B">nghiệp vụ giao nhận h&#224;ng h&#243;a xuất nhập khẩu (Incoterms),</text>
<text x="65" y="337" font-family="Georgia, serif" font-size="15.5" fill="#1E293B">1.2. T&#225;c giả bi&#234;n soạn: GS.TS. Từ Sỹ S&#249;a.</text>
<text x="65" y="377" font-family="Georgia, serif" font-size="15.5" fill="#1E293B">1.3. C&#225;c nguy&#234;n l&#253; v&#224; ti&#234;u chuẩn kỹ thuật bắt buộc tu&#226;n</text>
<text x="65" y="403" font-family="Georgia, serif" font-size="15.5" fill="#1E293B">thủ:</text>
<text x="65" y="443" font-family="Georgia, serif" font-size="15.5" fill="#1E293B">• Đảm bảo t&#237;nh ch&#237;nh x&#225;c to&#225;n học, to&#224;n vẹn dữ liệu v&#224; khả</text>
<text x="65" y="469" font-family="Georgia, serif" font-size="15.5" fill="#1E293B">năng mở rộng hệ thống.</text>
<text x="65" y="509" font-family="Georgia, serif" font-size="15.5" fill="#1E293B">• Kết hợp chặt chẽ giữa m&#244; h&#236;nh l&#253; thuyết với quy chuẩn kỹ</text>
<text x="65" y="535" font-family="Georgia, serif" font-size="15.5" fill="#1E293B">thuật quốc gia (TCVN / Quốc tế).</text>

