    <text x="80" y="129" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#0F2A4A">CHƯƠNG 1: TỔNG QUAN &amp; CƠ SỞ LÝ THUYẾT CỐT LÕI</text>
      <text x="64" y="182" font-family="'Segoe UI', Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0F172A">1.1. Đặt vấn đề và bối cảnh nghiên cứu (NXB Đại Học Quốc</text>
      <text x="64" y="205" font-family="'Segoe UI', Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0F172A">Gia Hà Nội, 2024):</text>
      <text x="64" y="238" font-family="'Segoe UI', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1E293B">Phân tích độ phức tạp thuật toán, cây đỏ-đen, bảng băm,</text>
      <text x="64" y="261" font-family="'Segoe UI', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1E293B">quy hoạch động, thuật toán đồ thị Dijkstra, A* ứng dụng</text>
      <text x="64" y="284" font-family="'Segoe UI', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1E293B">trong tìm đường ngắn nhất trên mạng lưới giao thông.</text>
      <text x="64" y="317" font-family="'Segoe UI', Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0F172A">1.2. Tác giả biên soạn: GS. Thomas H. Cormen, TS. Lê</text>
      <text x="64" y="340" font-family="'Segoe UI', Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0F172A">Minh Hoàng.</text>
      <text x="64" y="373" font-family="'Segoe UI', Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0F172A">1.3. Các nguyên lý và tiêu chuẩn kỹ thuật bắt buộc tuân</text>
      <text x="64" y="396" font-family="'Segoe UI', Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0F172A">thủ:</text>
      <text x="64" y="429" font-family="'Segoe UI', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1E293B">• Đảm bảo tính chính xác toán học, toàn vẹn dữ liệu và</text>
      <text x="64" y="452" font-family="'Segoe UI', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1E293B">khả năng mở rộng hệ thống.</text>
      <text x="64" y="485" font-family="'Segoe UI', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1E293B">• Kết hợp chặt chẽ giữa mô hình lý thuyết với quy chuẩn</text>
      <text x="64" y="508" font-family="'Segoe UI', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1E293B">kỹ thuật quốc gia (TCVN / Quốc tế).</text>

