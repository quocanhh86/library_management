  <text x="80" y="142" font-family="Segoe UI, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#4A1D1F">CHƯƠNG 1: TỔNG QUAN &amp; CƠ SỞ L&#221; THUYẾT CỐT L&#213;I</text>
  <text x="65" y="205" font-family="Georgia, serif" font-size="15.5" fill="#1E293B">1.1. Đặt vấn đề v&#224; bối cảnh nghi&#234;n cứu (NXB Giao Th&#244;ng Vận</text>
<text x="65" y="231" font-family="Georgia, serif" font-size="15.5" fill="#1E293B">Tải, 1998):</text>
<text x="65" y="271" font-family="Georgia, serif" font-size="15.5" fill="#1E293B">T&#224;i liệu lịch sử ng&#224;nh đường sắt đ&#227; chuyển sang lưu trữ</text>
