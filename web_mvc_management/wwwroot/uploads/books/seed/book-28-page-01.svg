<text x="65" y="337" font-family="Georgia, serif" font-size="15.5" fill="#1E293B">1.2. T&#225;c giả bi&#234;n soạn: GS.TS. Phạm Văn Lang.</text>
<text x="65" y="377" font-family="Georgia, serif" font-size="15.5" fill="#1E293B">1.3. C&#225;c nguy&#234;n l&#253; v&#224; ti&#234;u chuẩn kỹ thuật bắt buộc tu&#226;n</text>
<text x="65" y="403" font-family="Georgia, serif" font-size="15.5" fill="#1E293B">thủ:</text>
<text x="65" y="443" font-family="Georgia, serif" font-size="15.5" fill="#1E293B">• Đảm bảo t&#237;nh ch&#237;nh x&#225;c to&#225;n học, to&#224;n vẹn dữ liệu v&#224; khả</text>
<text x="65" y="469" font-family="Georgia, serif" font-size="15.5" fill="#1E293B">năng mở rộng hệ thống.</text>
<text x="65" y="509" font-family="Georgia, serif" font-size="15.5" fill="#1E293B">• Kết hợp chặt chẽ giữa m&#244; h&#236;nh l&#253; thuyết với quy chuẩn kỹ</text>
<text x="65" y="535" font-family="Georgia, serif" font-size="15.5" fill="#1E293B">thuật quốc gia (TCVN / Quốc tế).</text>

